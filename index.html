<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RΞX | متجر فاخر - تسجيل Google فقط</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0B0B0F;
      font-family: 'Inter', 'Cairo', sans-serif;
      color: #FFFFFF;
      overflow-x: hidden;
    }
    .stars-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, #0B0B0F, #030105);
      z-index: -3;
    }
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 70px 120px, #9D7BFF, rgba(0,0,0,0));
      background-size: 200px 200px, 150px 150px;
      background-repeat: repeat;
      opacity: 0.3;
      pointer-events: none;
      z-index: -2;
      animation: starMove 80s linear infinite;
    }
    @keyframes starMove {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 500px 500px, 300px 400px; }
    }
    .bg-glow {
      position: fixed;
      top: -20%;
      left: -10%;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, rgba(108,59,255,0.2) 0%, rgba(0,0,0,0) 70%);
      filter: blur(90px);
      z-index: -1;
    }
    .noise {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='1'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: -1;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px 32px; position: relative; }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(108,59,255,0.3);
      margin-bottom: 32px;
    }
    .logo h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #FFF, #9D7BFF);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .logo p { font-size: 0.7rem; color: #A1A1AA; }
    .nav-actions { display: flex; gap: 18px; align-items: center; }
    .nav-btn {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(108,59,255,0.3);
      border-radius: 40px;
      padding: 8px 18px;
      color: white;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(6px);
    }
    .nav-btn i { color: #9D7BFF; }
    .nav-btn:hover { background: rgba(108,59,255,0.2); border-color: #6C3BFF; }
    .cart-icon { position: relative; }
    .cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #6C3BFF;
      font-size: 0.7rem;
      border-radius: 30px;
      padding: 2px 7px;
      min-width: 20px;
    }
    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid #9D7BFF;
      object-fit: cover;
    }
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
      justify-content: center;
    }
    .cat-btn {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(108,59,255,0.4);
      padding: 8px 22px;
      border-radius: 40px;
      color: #D1D1E0;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .cat-btn.active { background: #6C3BFF; border-color: #9D7BFF; color: white; box-shadow: 0 0 12px rgba(108,59,255,0.4); }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
      margin-bottom: 60px;
    }
    .product-card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
      border-radius: 24px;
      border: 1px solid rgba(108,59,255,0.25);
      padding: 18px;
      transition: 0.25s;
      cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-6px);
      border-color: #9D7BFF;
      background: rgba(255,255,255,0.07);
      box-shadow: 0 20px 30px -12px black;
    }
    .product-img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 16px;
      background: #111;
      margin-bottom: 14px;
    }
    .product-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
    .product-price {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(120deg, #FFF, #C5B0FF);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .badge-stars { color: gold; letter-spacing: 2px; margin: 8px 0; }
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.96);
      background: rgba(16, 16, 24, 0.98);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      border: 1px solid #6C3BFF;
      padding: 28px;
      max-width: 520px;
      width: 90%;
      z-index: 1100;
      opacity: 0;
      visibility: hidden;
      transition: 0.2s;
    }
    .modal.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(3px);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: 0.2s;
    }
    .overlay.active { opacity: 1; visibility: visible; }
    .cart-drawer {
      position: fixed;
      top: 0;
      left: -500px;
      width: 500px;
      height: 100%;
      background: rgba(11,11,15,0.96);
      backdrop-filter: blur(16px);
      border-right: 1px solid #6C3BFF;
      z-index: 1200;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }
    .cart-drawer.open { left: 0; }
    .cart-item {
      display: flex;
      gap: 12px;
      background: rgba(255,255,255,0.02);
      border-radius: 20px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .cart-item-img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
    .cart-item-details { flex: 1; }
    .cart-quantity {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .cart-quantity button {
      background: #2a2a35;
      border: none;
      color: white;
      width: 26px;
      border-radius: 30px;
      cursor: pointer;
    }
    .checkout-btn {
      background: #6C3BFF;
      width: 100%;
      padding: 14px;
      border-radius: 60px;
      font-weight: bold;
      margin-top: 20px;
      border: none;
      color: white;
      cursor: pointer;
    }
    .order-card {
      background: rgba(255,255,255,0.02);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
      border: 1px solid #3A2C5A;
    }
    @media (max-width: 700px) {
      .cart-drawer { width: 100%; left: -100%; }
      .products-grid { grid-template-columns: 1fr; }
      .container { padding: 16px; }
    }
  </style>
</head>
<body>
<div class="stars-bg"></div><div class="stars"></div><div class="bg-glow"></div><div class="noise"></div>
<div class="container">
  <nav class="navbar">
    <div class="logo"><h1>RΞX</h1><p>رقمي | فاخر | فوري</p></div>
    <div class="nav-actions">
      <button class="nav-btn" id="userBtn"><i class="fab fa-google"></i> <span id="userNameDisplay">دخول Google</span></button>
      <button class="nav-btn cart-icon" id="cartIconBtn"><i class="fas fa-shopping-cart"></i> <span id="cartCount" class="cart-count">0</span></button>
      <button class="nav-btn" id="ordersBtn"><i class="fas fa-receipt"></i> فواتيري</button>
    </div>
  </nav>
  <div class="categories" id="categoryFilter"></div>
  <div id="productsGrid" class="products-grid"></div>
</div>

<div id="productModal" class="modal"><div id="productModalContent"></div><button class="nav-btn" style="margin-top:20px;" id="closeModalBtn">إغلاق</button></div>

<!-- نافذة تسجيل الدخول عبر Google فقط -->
<div id="loginModal" class="modal">
  <h3 style="margin-bottom:20px; text-align:center;"><i class="fab fa-google"></i> تسجيل الدخول بحساب Google</h3>
  <div id="g_id_onload" data-client_id="1042167030365-d1uvj8l7n8s4ioeija215ek97oh7scm5.apps.googleusercontent.com" data-callback="handleGoogleCredential" data-auto_prompt="false"></div>
  <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left" style="justify-content:center; display:flex;"></div>
  <p style="margin-top:20px; text-align:center; font-size:0.8rem; color:#A1A1AA;">✋ سجل دخولك بحساب Gmail للوصول إلى السلة والطلبات</p>
</div>

<div id="cartDrawer" class="cart-drawer">
  <h3><i class="fas fa-bag-shopping"></i> سلة التسوق</h3>
  <div id="cartItemsList" style="flex:1; overflow:auto; margin:20px 0;"></div>
  <div id="cartTotal" style="font-size:1.4rem; font-weight:bold;">المجموع: $0</div>
  <button id="checkoutFinalBtn" class="checkout-btn">إنهاء الطلب →</button>
  <button id="closeCartBtn" style="margin-top:12px; background:none; border:1px solid #333; padding:8px; border-radius:60px;">إغلاق</button>
</div>

<div id="ordersModal" class="modal" style="max-width:800px; max-height:80vh; overflow-y:auto;">
  <h2>📋 فواتيري</h2>
  <div id="ordersListContainer"></div>
  <button id="closeOrdersBtn" class="nav-btn" style="margin-top:16px;">إغلاق</button>
</div>

<script>
  // ================= المنتجات (36 منتجاً) =================
  const categoriesList = ["الكل", "Discord", "Streaming", "Software", "Gaming", "أخرى"];
  const productsData = [];
  const titles = ["Discord 2015","Discord 2016","Discord 2017","Discord 2018","Discord 2019","Discord Nitro","Netflix 4K","Netflix UHD","Spotify Premium","Spotify Family","YouTube Premium","Hulu No Ads","Adobe All Apps","Adobe Photoshop","Adobe Premiere","Windows 11 Pro","Office 365","Xbox Game Pass","PS Plus Deluxe","Steam Wallet $50","Razer Gold","NordVPN","ExpressVPN","Canva Pro","ChatGPT Plus","Midjourney Plan","Tidal HiFi","Crunchyroll","Disney+","Apple Music","Amazon Prime","TradingView Pro","Zoom Pro","Notion AI","League Skin","Valorant Points"];
  const categoriesAssign = ["Discord","Discord","Discord","Discord","Discord","Discord","Streaming","Streaming","Streaming","Streaming","Streaming","Streaming","Software","Software","Software","Software","Software","Gaming","Gaming","Gaming","Gaming","أخرى","أخرى","Software","Software","أخرى","Streaming","Streaming","Streaming","Streaming","Streaming","أخرى","Software","Software","Gaming","Gaming"];
  for(let i=0; i<36; i++) {
    productsData.push({
      id: i+1,
      title: titles[i%titles.length] + (i>20 ? ` ${Math.floor(i/3)}` : ""),
      category: categoriesAssign[i%categoriesAssign.length],
      price: 19.99 + (i*2.5),
      image: `https://picsum.photos/id/${100+i}/400/300`,
      stars: 4.2 + (i%8)/10,
      description: `حساب ${titles[i%titles.length]} بجودة فاخرة، ضمان مدى الحياة، تسليم فوري عبر البريد الإلكتروني.`
    });
  }
  productsData[0].price = 49.99; productsData[2].price = 59.99; productsData[5].price = 79.99;

  // ================= الحالة العامة =================
  let currentUser = null;
  let cart = [];
  let orders = [];
  let activeCategory = "الكل";

  function saveAppData() {
    localStorage.setItem("rex_cart", JSON.stringify(cart));
    localStorage.setItem("rex_orders", JSON.stringify(orders));
    if(currentUser) localStorage.setItem("rex_user", JSON.stringify(currentUser));
    else localStorage.removeItem("rex_user");
  }
  function loadAppData() {
    const savedCart = localStorage.getItem("rex_cart");
    if(savedCart) cart = JSON.parse(savedCart);
    const savedOrders = localStorage.getItem("rex_orders");
    if(savedOrders) orders = JSON.parse(savedOrders);
    const savedUser = localStorage.getItem("rex_user");
    if(savedUser) currentUser = JSON.parse(savedUser);
    updateCartUI();
    renderProducts();
    updateUserUI();
  }

  function updateCartUI() {
    const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.getElementById("cartCount").innerText = totalItems;
    const cartContainer = document.getElementById("cartItemsList");
    if(!cartContainer) return;
    if(cart.length===0) {
      cartContainer.innerHTML = "<div style='text-align:center; padding:20px;'>🛒 السلة فارغة</div>";
      document.getElementById("cartTotal").innerHTML = "المجموع: $0";
      return;
    }
    let html = "", total = 0;
    cart.forEach((item, idx) => {
      total += item.price * item.quantity;
      html += `<div class="cart-item"><img class="cart-item-img" src="${item.image}"><div class="cart-item-details"><strong>${item.title}</strong><div>$${item.price}</div><div class="cart-quantity"><button data-idx="${idx}" data-op="dec">-</button><span>${item.quantity}</span><button data-idx="${idx}" data-op="inc">+</button><button data-idx="${idx}" data-op="del" style="background:#b91c1c;">حذف</button></div></div></div>`;
    });
    cartContainer.innerHTML = html;
    document.getElementById("cartTotal").innerHTML = `المجموع: $${total.toFixed(2)}`;
    document.querySelectorAll("[data-op]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const idx = parseInt(btn.dataset.idx);
        const op = btn.dataset.op;
        if(op === "inc") cart[idx].quantity += 1;
        else if(op === "dec") { if(cart[idx].quantity>1) cart[idx].quantity -= 1; else cart.splice(idx,1); }
        else if(op === "del") cart.splice(idx,1);
        saveAppData();
        updateCartUI();
      });
    });
  }

  function renderProducts() {
    let filtered = activeCategory === "الكل" ? productsData : productsData.filter(p => p.category === activeCategory);
    const grid = document.getElementById("productsGrid");
    if(!grid) return;
    grid.innerHTML = filtered.map(p => `
      <div class="product-card" data-id="${p.id}">
        <img class="product-img" src="${p.image}" loading="lazy">
        <div class="product-title">${p.title}</div>
        <div class="badge-stars">${"★".repeat(Math.floor(p.stars))}${p.stars%1>=0.5?"½":""} (${p.stars})</div>
        <div class="product-price">$${p.price.toFixed(2)}</div>
      </div>
    `).join("");
    document.querySelectorAll(".product-card").forEach(card => {
      card.addEventListener("click", () => {
        const id = parseInt(card.dataset.id);
        const prod = productsData.find(p=>p.id===id);
        showProductDetails(prod);
      });
    });
  }

  function showProductDetails(prod) {
    const modal = document.getElementById("productModal");
    const content = document.getElementById("productModalContent");
    content.innerHTML = `
      <h2>${prod.title}</h2>
      <img src="${prod.image}" style="width:100%; border-radius:24px; margin:16px 0;">
      <p>${prod.description}</p>
      <div class="badge-stars">⭐ ${prod.stars} نجوم</div>
      <h3 style="font-size:1.8rem;">$${prod.price.toFixed(2)}</h3>
      <button class="nav-btn" id="detailsAddToCart" style="margin-top:12px;">🛒 أضف إلى السلة</button>
    `;
    modal.classList.add("active");
    overlay.classList.add("active");
    document.getElementById("detailsAddToCart")?.addEventListener("click", () => {
      addToCart(prod);
      modal.classList.remove("active");
      overlay.classList.remove("active");
    });
  }

  function addToCart(product) {
    const existing = cart.find(i => i.id === product.id);
    if(existing) existing.quantity += 1;
    else cart.push({ ...product, quantity: 1 });
    saveAppData();
    updateCartUI();
  }

  // Google Login Callback
  window.handleGoogleCredential = (response) => {
    const payload = JSON.parse(atob(response.credential.split(".")[1]));
    currentUser = {
      name: payload.name,
      email: payload.email,
      picture: payload.picture,
    };
    saveAppData();
    updateUserUI();
    closeLoginModal();
    alert(`مرحباً ${currentUser.name}، تم تسجيل الدخول بنجاح.`);
  };

  function updateUserUI() {
    const span = document.getElementById("userNameDisplay");
    if(currentUser) {
      const avatarHtml = currentUser.picture ? `<img src="${currentUser.picture}" class="user-avatar">` : `<i class="fas fa-user-circle"></i>`;
      span.innerHTML = `${avatarHtml} ${currentUser.name.split(" ")[0]}`;
    } else {
      span.innerHTML = `<i class="fab fa-google"></i> دخول Google`;
    }
  }

  function placeOrder() {
    if(!currentUser) { alert("يرجى تسجيل الدخول بحساب Google أولاً"); openLoginModal(); return; }
    if(cart.length===0) { alert("السلة فارغة"); return; }
    const total = cart.reduce((s,i) => s + (i.price * i.quantity), 0);
    const newOrder = {
      orderId: "REX-" + Date.now() + "-" + Math.floor(Math.random()*1000),
      date: new Date().toLocaleString('ar-EG'),
      items: cart.map(i => ({ title: i.title, price: i.price, quantity: i.quantity })),
      total: total,
      userEmail: currentUser.email
    };
    orders.unshift(newOrder);
    cart = [];
    saveAppData();
    updateCartUI();
    alert(`✅ تم إنشاء الطلب بنجاح\n📦 كود الطلب: ${newOrder.orderId}\n📅 التاريخ: ${newOrder.date}\n💰 الإجمالي: $${total.toFixed(2)}\n📧 تم إرسال التأكيد إلى بريدك: ${currentUser.email}`);
    showOrdersModal();
    closeCartDrawer();
  }

  function showOrdersModal() {
    const container = document.getElementById("ordersListContainer");
    if(!container) return;
    if(orders.length === 0) container.innerHTML = "<p>لا توجد طلبات سابقة</p>";
    else {
      container.innerHTML = orders.map(order => `
        <div class="order-card">
          <strong>🧾 كود الطلب:</strong> ${order.orderId}<br>
          <strong>📅 التاريخ:</strong> ${order.date}<br>
          <strong>💰 الإجمالي:</strong> $${order.total.toFixed(2)}<br>
          <strong>🛍️ المنتجات:</strong>
          <ul>${order.items.map(i => `<li>${i.title} x${i.quantity} = $${(i.price*i.quantity).toFixed(2)}</li>`).join("")}</ul>
          <button class="nav-btn print-invoice" data-order='${JSON.stringify(order)}'>🖨️ طباعة الفاتورة</button>
        </div>
      `).join("");
    }
    document.querySelectorAll(".print-invoice").forEach(btn => {
      btn.addEventListener("click", () => {
        const order = JSON.parse(btn.dataset.order);
        printInvoice(order);
      });
    });
    document.getElementById("ordersModal").classList.add("active");
    overlay.classList.add("active");
  }

  function printInvoice(order) {
    const win = window.open("", "_blank");
    win.document.write(`
      <html dir="rtl">
      <head><title>فاتورة ${order.orderId}</title>
      <style>body{font-family:'Cairo',sans-serif; padding:30px;} table{border-collapse:collapse; width:100%} th,td{border:1px solid #ccc; padding:8px; text-align:right;}</style>
      </head>
      <body>
        <h1>RΞX</h1>
        <h2>كود الطلب: ${order.orderId}</h2>
        <p>التاريخ: ${order.date}</p>
        </table><th>المنتج</th><th>الكمية</th><th>السعر</th></tr>
        ${order.items.map(i => `<tr><td>${i.title}</td><td>${i.quantity}</td><td>$${i.price}</td></tr>`).join("")}
        <tr><td colspan="2"><strong>المجموع</strong></td><td><strong>$${order.total.toFixed(2)}</strong></td></tr>
        </table>
        <button onclick="window.print()">طباعة</button>
        <script>window.onload=function(){ window.print(); }<\/script>
      </body>
      </html>
    `);
    win.document.close();
  }

  // إدارة النوافذ
  const overlay = document.createElement("div"); overlay.className="overlay"; document.body.appendChild(overlay);
  function openLoginModal() { document.getElementById("loginModal").classList.add("active"); overlay.classList.add("active"); }
  function closeLoginModal() { document.getElementById("loginModal").classList.remove("active"); overlay.classList.remove("active"); }
  function closeCartDrawer() { document.getElementById("cartDrawer").classList.remove("open"); overlay.classList.remove("active"); }
  function openCartDrawer() { document.getElementById("cartDrawer").classList.add("open"); overlay.classList.add("active"); }

  document.getElementById("userBtn")?.addEventListener("click", () => {
    if(currentUser) { if(confirm("تسجيل الخروج؟")) { currentUser = null; saveAppData(); updateUserUI(); } }
    else openLoginModal();
  });
  document.getElementById("cartIconBtn")?.addEventListener("click", openCartDrawer);
  document.getElementById("closeCartBtn")?.addEventListener("click", closeCartDrawer);
  document.getElementById("checkoutFinalBtn")?.addEventListener("click", placeOrder);
  document.getElementById("ordersBtn")?.addEventListener("click", showOrdersModal);
  document.getElementById("closeModalBtn")?.addEventListener("click", () => { document.getElementById("productModal").classList.remove("active"); overlay.classList.remove("active"); });
  document.getElementById("closeOrdersBtn")?.addEventListener("click", () => { document.getElementById("ordersModal").classList.remove("active"); overlay.classList.remove("active"); });
  overlay.addEventListener("click", () => { document.querySelectorAll(".modal").forEach(m=>m.classList.remove("active")); closeCartDrawer(); });

  function renderCategories() {
    const catDiv = document.getElementById("categoryFilter");
    catDiv.innerHTML = categoriesList.map(cat => `<button class="cat-btn ${cat===activeCategory?'active':''}" data-cat="${cat}">${cat}</button>`).join("");
    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.cat;
        renderCategories();
        renderProducts();
      });
    });
  }
  renderCategories();
  loadAppData();
  updateUserUI();
</script>
</body>
</html>
