<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>REX - لوحة القيادة الإدارية</title>
    <!-- TailwindCSS + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- تخصيص الثيم الداكن والذهبي -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Orbitron:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap');
        * {
            font-family: 'Tajawal', 'Montserrat', sans-serif;
        }
        body {
            background-color: #050505;
            overflow-x: hidden;
        }
        /* أنيميشن بسيط للقائمة الجانبية */
        .sidebar {
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%);
            z-index: 1000;
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .gold-glow {
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        /* تخصيص الأزرار والبطاقات */
        .card-gold-border {
            border-right: 3px solid #D4AF37;
            transition: 0.2s;
        }
        .btn-gold {
            background: transparent;
            border: 1px solid #D4AF37;
            color: #D4AF37;
            transition: 0.3s;
        }
        .btn-gold:hover {
            background: #D4AF37;
            color: #0a0a0a;
        }
    </style>
</head>
<body class="text-gray-200">

    <!-- القائمة الجانبية (Slide Menu) -->
    <div id="sidebar" class="sidebar fixed top-0 left-0 h-full w-72 bg-black border-l border-[#D4AF37] p-5 flex flex-col z-50" style="right: 0; left: auto; transform: translateX(100%);">
        <div class="flex justify-between items-center mb-8">
            <div class="text-2xl font-bold text-[#D4AF37]" style="font-family: 'Orbitron';">REX</div>
            <button id="closeSidebarBtn" class="text-white text-2xl"><i class="fas fa-times"></i></button>
        </div>
        <nav class="flex flex-col gap-4 text-lg">
            <a href="#" class="sidebar-link hover:text-[#D4AF37]" data-page="dashboard"><i class="fas fa-tachometer-alt ml-2"></i> Dashboard</a>
            <a href="#" class="sidebar-link hover:text-[#D4AF37]" data-page="reports"><i class="fas fa-chart-line ml-2"></i> التقارير</a>
            <a href="#" class="sidebar-link hover:text-[#D4AF37]" data-page="letters"><i class="fas fa-envelope ml-2"></i> الخطابات</a>
            <a href="#" class="sidebar-link hover:text-[#D4AF37]" data-page="users"><i class="fas fa-users ml-2"></i> المستخدمون</a>
            <a href="#" class="sidebar-link hover:text-[#D4AF37]" data-page="roles" id="rolesNavItem" style="display: none;"><i class="fas fa-crown ml-2"></i> الرتب والصلاحيات</a>
            <a href="#" class="sidebar-link hover:text-[#D4AF37]" data-page="settings"><i class="fas fa-cog ml-2"></i> الإعدادات</a>
        </nav>
        <div class="mt-auto pt-5 border-t border-gray-800 text-sm text-gray-400">
            <button id="logoutBtn" class="w-full text-right"><i class="fas fa-sign-out-alt ml-2"></i> تسجيل الخروج</button>
        </div>
    </div>

    <!-- Overlay عند فتح القائمة -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden"></div>

    <!-- المحتوى الرئيسي -->
    <div class="container mx-auto px-4 py-4 max-w-7xl">
        <!-- الهيدر -->
        <div class="flex justify-between items-center mb-6">
            <button id="menuToggle" class="text-2xl text-[#D4AF37]"><i class="fas fa-bars"></i></button>
            <div class="text-xl font-bold tracking-wider text-[#D4AF37]" style="font-family: 'Orbitron';">REX SYSTEM</div>
            <div id="userAvatar" class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center cursor-pointer relative">
                <i class="fas fa-user-circle text-2xl text-[#D4AF37]"></i>
            </div>
        </div>

        <!-- حالة تسجيل الدخول / عرض المستخدم -->
        <div id="authContainer" class="bg-black/60 rounded-2xl p-5 border border-[#D4AF37]/30 text-center mb-5">
            <div id="unauthenticatedView">
                <i class="fab fa-discord text-5xl text-[#5865F2] mb-3"></i>
                <h2 class="text-xl font-bold mb-2">مرحباً بك في REX</h2>
                <p class="text-gray-400 text-sm mb-4">نظام إداري احترافي متكامل</p>
                <button id="discordLoginBtn" class="bg-[#5865F2] hover:bg-[#4752c4] text-white font-bold py-2 px-6 rounded-full transition"><i class="fab fa-discord ml-2"></i> Login with Discord</button>
                <p class="text-xs text-gray-500 mt-3">(محاكاة OAuth - سيتم تسجيل دخول وهمي لتجربة النظام)</p>
            </div>
            <div id="authenticatedView" class="hidden">
                <div class="flex items-center gap-3 justify-between flex-wrap">
                    <div class="flex items-center gap-3">
                        <img id="userImg" class="w-12 h-12 rounded-full border-2 border-[#D4AF37]" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="avatar">
                        <div class="text-right">
                            <div id="userName" class="font-bold text-lg">REX Member</div>
                            <div id="userRoleBadge" class="text-xs text-[#D4AF37]">👤 عضو</div>
                        </div>
                    </div>
                    <div id="roleSpecificActions" class="text-sm"></div>
                </div>
            </div>
        </div>

        <!-- صفحات الموقع الديناميكية -->
        <div id="pageContent">
            <!-- سيتم تحميل المحتوى هنا عبر JS -->
        </div>
    </div>

    <script>
        // ---------- البيانات الأساسية ----------
        // تعريف الرتب والصلاحيات (مطابق للهيكل المطلوب)
        const ROLES = {
            "👑 Owner": { level: 10, permissions: ["all"], nameAr: "المالك" },
            "🏛️ Co-Owner": { level: 9, permissions: ["manage_reports", "manage_users", "view_all"], nameAr: "نائب المالك" },
            "⚙️ Director": { level: 8, permissions: ["approve_letters", "view_reports", "manage_members"], nameAr: "مدير عام" },
            "🧠 Admin Supreme": { level: 7, permissions: ["view_reports", "manage_letters", "view_logs"], nameAr: "المشرف الأسمى" },
            "🛡️ Senior Admin": { level: 6, permissions: ["view_reports", "manage_letters"], nameAr: "عميد الإداريين" },
            "🔧 Admin": { level: 5, permissions: ["view_reports", "send_letters"], nameAr: "مدير" },
            "📊 Supervisor": { level: 4, permissions: ["view_reports_limited", "send_letters"], nameAr: "مشرف" },
            "🧾 Analyst": { level: 3, permissions: ["view_reports_limited"], nameAr: "محلل تقارير" },
            "🎯 Moderator": { level: 2, permissions: ["send_letters"], nameAr: "وسيط" },
            "👤 Member": { level: 1, permissions: ["send_letters", "view_self"], nameAr: "عضو" },
            "🆕 New Member": { level: 0, permissions: ["view_self"], nameAr: "عضو جديد" }
        };

        // المستخدم الحالي (محاكاة)
        let currentUser = null;

        // البيانات الوهمية: قائمة المستخدمين (لإدارة المالك)
        let usersList = [
            { discordId: "123456", username: "REX_Owner", avatar: "https://cdn.discordapp.com/embed/avatars/1.png", role: "👑 Owner", email: "owner@rex.com" },
            { discordId: "789012", username: "Nova_Admin", avatar: "https://cdn.discordapp.com/embed/avatars/2.png", role: "🔧 Admin", email: "admin@rex.com" },
            { discordId: "345678", username: "Steel_Analyst", avatar: "https://cdn.discordapp.com/embed/avatars/3.png", role: "🧾 Analyst", email: "analyst@rex.com" },
            { discordId: "999888", username: "GoldMember", avatar: "https://cdn.discordapp.com/embed/avatars/4.png", role: "👤 Member", email: "member@rex.com" }
        ];

        // التقارير الشهرية (بيانات عينة)
        let monthlyReports = [
            { month: "شوال 1446", date: "2025-04-01", summary: "نشاط مرتفع + زيادة الخطابات", details: { newMembers: 32, letters: 87, decisions: 45 } },
            { month: "رمضان 1446", date: "2025-03-01", summary: "استقرار إداري", details: { newMembers: 28, letters: 74, decisions: 38 } }
        ];

        // الخطابات (سجل)
        let lettersList = [
            { id: 1, sender: "Owner", type: "طلب ترقية", content: "أطلب ترقية العضو X", status: "قيد المراجعة", date: "2025-04-10" },
            { id: 2, sender: "Admin", type: "شكوى", content: "مشكلة تقنية", status: "تم الرد", date: "2025-04-05" }
        ];

        // دالة التحقق من صلاحية
        function hasPermission(userRole, requiredPerm) {
            if (!userRole) return false;
            const perms = ROLES[userRole]?.permissions || [];
            if (perms.includes("all")) return true;
            return perms.includes(requiredPerm);
        }

        // تخزين الجلسة
        function saveUserSession(user) {
            localStorage.setItem("rex_user", JSON.stringify(user));
            currentUser = user;
        }
        function loadUserSession() {
            const data = localStorage.getItem("rex_user");
            if (data) {
                currentUser = JSON.parse(data);
                return true;
            }
            return false;
        }
        function logout() {
            localStorage.removeItem("rex_user");
            currentUser = null;
            renderAuthUI();
            renderPage("dashboard");
        }

        // محاكاة تسجيل الدخول عبر Discord (اختيار عشوائي لأحد المستخدمين للاختبار أو إنشاء مستخدم جديد)
        function simulateDiscordLogin() {
            // نعرض نافذة اختيار سريع لاختبار صلاحيات مختلفة، لسهولة التجربة.
            const roleOptions = Object.keys(ROLES);
            let selectedRole = prompt("اختر رتبة لتجربة النظام (لاختبار الصلاحيات):\n" + roleOptions.join("\n") + "\n\nاكتب الاسم كما هو (مثال: 👑 Owner)", "👤 Member");
            if (!selectedRole || !ROLES[selectedRole]) selectedRole = "👤 Member";
            const newId = Math.floor(Math.random() * 1000000).toString();
            const fakeUser = {
                discordId: newId,
                username: `Discord_${selectedRole.slice(0,3)}`,
                avatar: `https://cdn.discordapp.com/embed/avatars/${Math.floor(Math.random()*5)}.png`,
                role: selectedRole,
                email: `${selectedRole.replace(/\s/g,'')}@rex.com`
            };
            saveUserSession(fakeUser);
            renderAuthUI();
            renderPage("dashboard");
        }

        // عرض حالة الدخول
        function renderAuthUI() {
            if (currentUser) {
                document.getElementById("unauthenticatedView").classList.add("hidden");
                document.getElementById("authenticatedView").classList.remove("hidden");
                document.getElementById("userName").innerText = currentUser.username;
                document.getElementById("userImg").src = currentUser.avatar;
                let roleAr = ROLES[currentUser.role]?.nameAr || "عضو";
                document.getElementById("userRoleBadge").innerHTML = `<i class="fas fa-shield-alt"></i> ${currentUser.role} - ${roleAr}`;
                const roleActionsDiv = document.getElementById("roleSpecificActions");
                if (hasPermission(currentUser.role, "all")) {
                    roleActionsDiv.innerHTML = `<span class="bg-[#D4AF37] text-black px-2 py-1 rounded-full text-xs"><i class="fas fa-crown"></i> صلاحية كاملة</span>`;
                } else if (hasPermission(currentUser.role, "manage_users")) {
                    roleActionsDiv.innerHTML = `<span class="border border-[#D4AF37] px-2 rounded-full text-xs">إدارة عليا</span>`;
                } else {
                    roleActionsDiv.innerHTML = `<span class="text-gray-400 text-xs">صلاحيات محددة حسب الرتبة</span>`;
                }
                // إظهار رابط إدارة الرتب للمالك فقط
                if (currentUser.role === "👑 Owner") {
                    document.getElementById("rolesNavItem").style.display = "block";
                } else {
                    document.getElementById("rolesNavItem").style.display = "none";
                }
            } else {
                document.getElementById("unauthenticatedView").classList.remove("hidden");
                document.getElementById("authenticatedView").classList.add("hidden");
            }
        }

        // عرض الصفحات حسب المحتوى -----------------------------------------------------------------
        function renderPage(pageName) {
            const container = document.getElementById("pageContent");
            if (!currentUser) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400"><i class="fas fa-lock text-4xl mb-3"></i><p>يرجى تسجيل الدخول عبر Discord للوصول إلى لوحة التحكم.</p></div>`;
                return;
            }
            if (pageName === "dashboard") renderDashboard(container);
            else if (pageName === "reports") renderReports(container);
            else if (pageName === "letters") renderLetters(container);
            else if (pageName === "users") renderUsersManagement(container);
            else if (pageName === "roles") renderRolesPanel(container);
            else if (pageName === "settings") renderSettings(container);
            else renderDashboard(container);
        }

        // Dashboard
        function renderDashboard(container) {
            const canViewReports = hasPermission(currentUser.role, "view_reports") || hasPermission(currentUser.role, "view_reports_limited") || hasPermission(currentUser.role, "all");
            container.innerHTML = `
                <div class="space-y-5">
                    <div class="bg-black/50 rounded-2xl p-5 border-r-4 border-[#D4AF37]">
                        <h3 class="text-2xl font-bold">مرحباً، ${currentUser.username}</h3>
                        <p class="text-gray-300">الرتبة: ${currentUser.role} - ${ROLES[currentUser.role]?.nameAr}</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-black/40 p-4 rounded-xl"><i class="fas fa-chart-simple text-[#D4AF37] text-2xl"></i><p class="mt-2">نشاطك: ${Math.floor(Math.random()*100)+20} نقطة تفاعل</p></div>
                        <div class="bg-black/40 p-4 rounded-xl"><i class="fas fa-bell text-[#D4AF37] text-2xl"></i><p class="mt-2">إشعارات: 3 جديدة</p></div>
                    </div>
                    ${canViewReports ? `<div class="bg-black/50 p-4 rounded-xl"><h4 class="font-bold text-[#D4AF37]">📊 آخر تقرير شهري</h4><p>${monthlyReports[0]?.summary || "لا توجد تقارير"}</p><button id="viewFullReportBtn" class="btn-gold px-4 py-1 rounded-full text-sm mt-2">عرض التفاصيل</button></div>` : `<div class="bg-black/30 p-4 rounded-xl text-gray-400">ليس لديك صلاحية لعرض التقارير.</div>`}
                    <div class="text-center text-gray-500 text-xs mt-4">REX System v1.0 - إدارة ذكية</div>
                </div>
            `;
            const reportBtn = document.getElementById("viewFullReportBtn");
            if (reportBtn) reportBtn.onclick = () => renderPage("reports");
        }

        // التقارير
        function renderReports(container) {
            if (!hasPermission(currentUser.role, "view_reports") && !hasPermission(currentUser.role, "view_reports_limited") && !hasPermission(currentUser.role, "all")) {
                container.innerHTML = `<div class="bg-red-900/30 p-6 rounded-xl text-center">⛔ غير مصرح لك بعرض التقارير.</div>`;
                return;
            }
            let reportsHtml = `<h2 class="text-2xl font-bold text-[#D4AF37] mb-4">📑 التقارير الشهرية التلقائية</h2>`;
            monthlyReports.forEach((rep, idx) => {
                reportsHtml += `<div class="bg-black/40 p-4 rounded-xl mb-3"><p class="font-bold">📅 ${rep.month} (${rep.date})</p><p>${rep.summary}</p><p class="text-sm text-gray-400">أعضاء جدد: ${rep.details.newMembers} | خطابات: ${rep.details.letters}</p></div>`;
            });
            if (hasPermission(currentUser.role, "all") || hasPermission(currentUser.role, "manage_reports")) {
                reportsHtml += `<button id="generateNewReportBtn" class="btn-gold w-full py-2 mt-3 rounded-full"><i class="fas fa-plus"></i> توليد تقرير جديد (محاكاة)</button>`;
            }
            container.innerHTML = reportsHtml;
            const genBtn = document.getElementById("generateNewReportBtn");
            if (genBtn) genBtn.onclick = () => {
                const newReport = { month: "ذي القعدة 1446", date: new Date().toISOString().slice(0,10), summary: "تقرير محدث - نشاط متزايد", details: { newMembers: 45, letters: 110, decisions: 67 } };
                monthlyReports.unshift(newReport);
                renderReports(container);
            };
        }

        // نظام الخطابات
        function renderLetters(container) {
            const canSend = hasPermission(currentUser.role, "send_letters") || hasPermission(currentUser.role, "all");
            container.innerHTML = `
                <h2 class="text-2xl font-bold text-[#D4AF37] mb-4">📨 إدارة الخطابات</h2>
                <div class="bg-black/40 p-4 rounded-xl mb-4">
                    <h3 class="font-bold">إرسال خطاب رسمي جديد</h3>
                    ${canSend ? `<textarea id="letterContent" rows="2" class="w-full bg-black border border-gray-700 p-2 rounded mt-2" placeholder="نص الخطاب..."></textarea>
                    <select id="letterType" class="bg-black border border-gray-700 p-2 rounded mt-2"><option>طلب</option><option>شكوى</option><option>اقتراح</option></select>
                    <button id="submitLetterBtn" class="btn-gold px-4 py-1 rounded-full mt-2">إرسال الخطاب</button>` : `<p class="text-red-400">ليس لديك صلاحية إرسال خطابات.</p>`}
                </div>
                <h3 class="font-bold mt-4">سجل الخطابات</h3>
                <div id="lettersList" class="space-y-2"></div>
            `;
            const lettersDiv = document.getElementById("lettersList");
            function refreshLetters() {
                lettersDiv.innerHTML = lettersList.map(l => `<div class="bg-black/30 p-3 rounded border-r-2 border-[#D4AF37]"><b>${l.sender}</b> (${l.type}): ${l.content} <span class="text-xs text-gray-400">${l.date} - ${l.status}</span></div>`).join("");
            }
            refreshLetters();
            if (canSend) {
                const submitBtn = document.getElementById("submitLetterBtn");
                submitBtn.onclick = () => {
                    const content = document.getElementById("letterContent").value;
                    const type = document.getElementById("letterType").value;
                    if(content.trim()) {
                        lettersList.unshift({ id: Date.now(), sender: currentUser.username, type, content, status: "قيد الانتظار", date: new Date().toISOString().slice(0,10) });
                        refreshLetters();
                        document.getElementById("letterContent").value = "";
                    } else alert("يرجى كتابة محتوى الخطاب");
                };
            }
        }

        // إدارة المستخدمين (للمالك والإدارة العليا)
        function renderUsersManagement(container) {
            const canManageUsers = hasPermission(currentUser.role, "manage_users") || currentUser.role === "👑 Owner";
            if (!canManageUsers) {
                container.innerHTML = `<div class="bg-red-900/30 p-6 rounded-xl">❌ صلاحية ممنوعة: تحتاج إلى رتبة إدارة عليا.</div>`;
                return;
            }
            let html = `<h2 class="text-2xl font-bold text-[#D4AF37] mb-4">👥 إدارة المستخدمين</h2><div class="overflow-x-auto"><table class="w-full text-right"><thead><tr class="border-b border-[#D4AF37]"><th>المستخدم</th><th>الرتبة الحالية</th><th>تغيير الرتبة</th></tr></thead><tbody>`;
            usersList.forEach((user, idx) => {
                html += `<tr class="border-b border-gray-800"><td class="py-2">${user.username}</td><td>${user.role}</td><td><select class="changeRoleSelect bg-black border border-gray-600 rounded" data-idx="${idx}">${Object.keys(ROLES).map(r => `<option ${user.role === r ? "selected" : ""}>${r}</option>`).join("")}</select></td></tr>`;
            });
            html += `</tbody></table></div><button id="saveRolesBtn" class="btn-gold mt-4 px-4 py-2 rounded-full">حفظ التغييرات</button>`;
            container.innerHTML = html;
            document.getElementById("saveRolesBtn").onclick = () => {
                const selects = document.querySelectorAll(".changeRoleSelect");
                selects.forEach(sel => {
                    const idx = parseInt(sel.dataset.idx);
                    usersList[idx].role = sel.value;
                });
                renderUsersManagement(container);
                alert("تم تحديث الرتب بنجاح");
                if(currentUser.role !== "👑 Owner") renderAuthUI();
                else renderAuthUI();
            };
        }

        // لوحة الرتب والصلاحيات (خاصة للمالك فقط)
        function renderRolesPanel(container) {
            if (currentUser.role !== "👑 Owner") {
                container.innerHTML = `<div class="text-center p-6">غير مصرح لك بالوصول إلى هذه الصفحة.</div>`;
                return;
            }
            let tableRows = "";
            for (const [roleName, data] of Object.entries(ROLES)) {
                tableRows += `<tr class="border-b"><td class="p-2">${roleName}</td><td>${data.nameAr}</td><td class="text-xs">${data.permissions.join(", ")}</td></tr>`;
            }
            container.innerHTML = `<h2 class="text-2xl font-bold text-[#D4AF37] mb-4">🏛️ هيكل الرتب والصلاحيات</h2><div class="overflow-x-auto"><table class="w-full"><thead><tr><th>الرتبة</th><th>الاسم العربي</th><th>الصلاحيات</th></tr></thead><tbody>${tableRows}</tbody></table></div><div class="mt-4 text-gray-400 text-sm">* المالك فقط يمكنه تعديل الرتب من صفحة المستخدمين.</div>`;
        }

        function renderSettings(container) {
            container.innerHTML = `<div class="bg-black/40 p-6 rounded-xl"><h2 class="text-xl gold-text">⚙️ الإعدادات</h2><p>خيارات النظام والتخصيص (PWA، الإشعارات) قريباً...</p><button id="clearCacheBtn" class="btn-gold mt-3 px-3 py-1 rounded">محاكاة مسح cache</button></div>`;
            document.getElementById("clearCacheBtn")?.addEventListener("click", ()=> alert("تم مسح بيانات الجلسة (محاكاة)"));
        }

        // Event Listeners للقائمة الجانبية والتنقل
        function initUI() {
            const menuBtn = document.getElementById("menuToggle");
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("sidebarOverlay");
            const closeSidebar = document.getElementById("closeSidebarBtn");
            function openSidebar() { sidebar.classList.add("open"); overlay.classList.remove("hidden"); }
            function closeSidebarFunc() { sidebar.classList.remove("open"); overlay.classList.add("hidden"); }
            menuBtn.onclick = openSidebar;
            closeSidebar.onclick = closeSidebarFunc;
            overlay.onclick = closeSidebarFunc;
            document.querySelectorAll(".sidebar-link").forEach(link => {
                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    const page = link.dataset.page;
                    if (page) renderPage(page);
                    closeSidebarFunc();
                });
            });
            document.getElementById("discordLoginBtn").onclick = () => simulateDiscordLogin();
            document.getElementById("logoutBtn").onclick = () => logout();
            if (loadUserSession()) {
                renderAuthUI();
                renderPage("dashboard");
            } else {
                renderAuthUI();
                renderPage("dashboard");
            }
        }
        initUI();
    </script>
</body>
</html>
